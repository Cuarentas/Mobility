name: Bug 报告
description: 提交程序运行中遇到的错误或异常问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间反馈问题！请尽量完整填写以下信息，这能帮助我们更快定位和解决问题。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请清晰地描述你遇到的问题
      placeholder: 例如：点击「启动代理」后程序无响应 / 系统代理设置失败 等
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请一步一步写出如何复现该问题
      placeholder: |
        1. 打开 Mobility.exe
        2. 点击「启动代理」
        3. 观察现象
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 你认为正确的行为应该是什么
      placeholder: 例如：点击启动后状态应显示为「运行中」，并成功设置系统代理
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际发生了什么
      placeholder: 例如：点击后无任何反应，状态仍显示「未运行」
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Mobility 版本
      description: 请填写你使用的版本号（可在 Releases 页面查看）
      placeholder: 例如：v1.0.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      description: 请填写你的 Windows 版本
      placeholder: 例如：Windows 11 23H2 / Windows 10 22H2
    validations:
      required: true

  - type: dropdown
    id: network
    attributes:
      label: 网络环境
      description: 你当前的网络情况
      options:
        - 直连（无代理）
        - 已使用其他代理工具
        - 公司/学校网络
        - 其他
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志或截图
      description: 如果有错误日志、弹窗截图，请在这里粘贴或描述
      placeholder: 可以在这里直接粘贴文字日志，或说明已上传截图

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过 Issues，确认这不是重复提交
          required: true
        - label: 我已经尝试过重新下载最新版本进行测试
          required: false
