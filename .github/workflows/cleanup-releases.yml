name: Cleanup Old Releases

on:
  workflow_dispatch: # 允许你手动点击按钮触发测试
  schedule:
    - cron: '0 0 * * *' # 每天自动运行一次

# 关键：声明允许使用默认的 GITHUB_TOKEN 进行写入（删除）操作
permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old releases
        uses: nikhilbadyal/ghaction-rm-releases@v0.8.0
        with:
          # 直接使用 GitHub 自动分配的 Token，无需手动配置
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 保留最近 3 个版本
          RELEASES_TO_KEEP: 3
          # 同时删除对应的 Tag
          DELETE_TAGS: true
          # 只匹配以 "Mobility v" 开头的版本（防止误删其他东西）
          RELEASE_PATTERN: "^Mobility v"
