name: Cleanup Old Releases

on:
  workflow_dispatch:

permissions:
  contents: write # 必须赋予写入权限

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Mobility releases
        run: |
          # 获取所有 release，筛选出以 "Mobility v" 开头的 tag
          # 按版本号倒序排列，保留最新 3 个（tail -n +4 表示从第 4 个开始处理）
          gh release list --repo ${{ github.repository }} --limit 200 --json tagName \
            | jq -r '.[].tagName | select(startswith("Mobility v"))' \
            | sort -rV | tail -n +4 \
            | while read -r tag; do
                if [ -n "$tag" ]; then
                  echo "Deleting release and tag: $tag"
                  # --cleanup-tag 参数确保同时删除对应的 Git Tag
                  gh release delete "$tag" --repo ${{ github.repository }} --yes --cleanup-tag
                fi
              done
        env:
          # 使用 GitHub 自动分配的 Token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
