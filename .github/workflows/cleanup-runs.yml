name: Cleanup Workflow Runs

# 独立任务：只清理 Actions 运行记录，不影响 Build / Release
on:
  workflow_dispatch:
    inputs:
      keep:
        description: '每个工作流保留最近多少条运行记录'
        required: true
        default: '5'
        type: string
      workflow_name:
        description: '只清理指定工作流名称（留空=清理全部工作流）'
        required: false
        default: ''
        type: string
  schedule:
    # 每周一 UTC 04:00 自动清理
    - cron: '0 4 * * 1'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: ${{ github.event.inputs.keep || '5' }}
          ONLY_NAME: ${{ github.event.inputs.workflow_name || '' }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          KEEP_N="$(echo "${KEEP}" | tr -cd '0-9')"
          if [ -z "${KEEP_N}" ] || [ "${KEEP_N}" -lt 1 ]; then
            KEEP_N=5
          fi
          echo "每个工作流保留最近 ${KEEP_N} 条运行记录"

          # 列出仓库内工作流
          mapfile -t WORKFLOWS < <(gh api "repos/${REPO}/actions/workflows" --paginate -q '.workflows[] | select(.state=="active") | "\(.id)\t\(.name)"')

          if [ ${#WORKFLOWS[@]} -eq 0 ]; then
            echo "未找到工作流"
            exit 0
          fi

          for line in "${WORKFLOWS[@]}"; do
            wf_id="${line%%$'\t'*}"
            wf_name="${line#*$'\t'}"

            if [ -n "${ONLY_NAME}" ] && [ "${wf_name}" != "${ONLY_NAME}" ]; then
              echo "跳过工作流：${wf_name}"
              continue
            fi

            # 不清理「正在跑」的本任务自己（可选：仍可删其它）
            if [ "${wf_name}" = "Cleanup Workflow Runs" ]; then
              echo "跳过自身工作流：${wf_name}"
              continue
            fi

            echo "======== 处理：${wf_name} (id=${wf_id}) ========"

            # 按创建时间倒序取运行 id（最多 200 条）
            mapfile -t RUN_IDS < <(gh api \
              "repos/${REPO}/actions/workflows/${wf_id}/runs?per_page=100" \
              --paginate \
              -q '.workflow_runs[] | .id' | head -n 200)

            total=${#RUN_IDS[@]}
            echo "当前记录数：${total}"

            if [ "${total}" -le "${KEEP_N}" ]; then
              echo "未超过保留数量，跳过"
              continue
            fi

            idx=0
            deleted=0
            for run_id in "${RUN_IDS[@]}"; do
              idx=$((idx + 1))
              if [ "${idx}" -le "${KEEP_N}" ]; then
                echo "[保留] #${idx} run ${run_id}"
                continue
              fi
              echo "[删除] #${idx} run ${run_id}"
              if gh api -X DELETE "repos/${REPO}/actions/runs/${run_id}" 2>/dev/null; then
                deleted=$((deleted + 1))
              else
                # 运行中的无法删，忽略
                echo "  无法删除（可能仍在运行）: ${run_id}"
              fi
              # 轻微限速，避免触发 API 限制
              sleep 0.15
            done
            echo "工作流 ${wf_name} 删除 ${deleted} 条"
          done

          echo "全部清理完成"
