name: Build Portable EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（例如 v0.1.0）'
        required: true
        default: 'v0.1.0'
        type: string
      prerelease:
        description: '是否标记为预发布（Pre-release）'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          python -m PyInstaller --version

      - name: Download Xray-core
        shell: pwsh
        run: |
          Write-Host "开始下载 Xray-core..."
          $api = "https://api.github.com/repos/XTLS/Xray-core/releases/latest"
          $release = Invoke-RestMethod -Uri $api -Headers @{ "User-Agent" = "GitHub-Actions" }
          $asset = $release.assets | Where-Object { $_.name -like "*windows-64.zip" -and $_.name -notlike "*arm64*" } | Select-Object -First 1
          if (-not $asset) {
            throw "Xray windows-64.zip not found"
          }
          Write-Host "找到文件: $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "xray.zip"
          if (Test-Path "core") { Remove-Item -Recurse -Force "core" }
          Expand-Archive -Path "xray.zip" -DestinationPath "core" -Force
          if (-not (Test-Path "core\xray.exe")) {
            throw "xray.exe not found after extract"
          }
          Write-Host "Xray-core 准备就绪"

      - name: Build with PyInstaller (onedir)
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed --name Mobility main.py

      - name: Package final zip (含 Xray-core)
        shell: pwsh
        run: |
          $distDir = "dist\Mobility"

          # 确保 core 目录存在并把 xray.exe 放进去
          $coreDir = Join-Path $distDir "core"
          if (-not (Test-Path $coreDir)) {
            New-Item -ItemType Directory -Path $coreDir -Force | Out-Null
          }
          Copy-Item -Path "core\xray.exe" -Destination "$coreDir\xray.exe" -Force
          Write-Host "已复制 xray.exe 到 $coreDir"

          # 检查是否复制成功
          if (-not (Test-Path "$coreDir\xray.exe")) {
            throw "复制 xray.exe 失败"
          }

          Write-Host "最终目录内容："
          Get-ChildItem -Recurse $distDir | ForEach-Object { Write-Host $_.FullName }

          # 打包成 zip
          $zipPath = "dist\Mobility.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "$distDir\*" -DestinationPath $zipPath -Force

          $zipInfo = Get-Item $zipPath
          Write-Host "打包完成: $($zipInfo.Name)  大小: $([math]::Round($zipInfo.Length / 1MB, 2)) MB"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mobility
          path: dist/Mobility.zip
          if-no-files-found: error

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}"
          } else {
            $ver = "${{ github.ref_name }}"
          }
          if (-not $ver.StartsWith("v")) {
            $ver = "v$ver"
          }
          echo "tag=$ver" >> $env:GITHUB_OUTPUT
          echo "使用版本号: $ver"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Mobility ${{ steps.version.outputs.tag }}"
          body: |
            <div align="center">
            
            # Mobility
            
            **Windows 便携版代理客户端**
            
            </div>
            
            ---
            
            ### ✨ 本版本亮点
            
            - 📦 解压即用，无需安装任何运行环境
            - 📦 **已内置 Xray-core**，首次运行无需联网下载核心
            - 🔌 一键启动 / 停止本地代理
            - 🌐 自动设置与取消 Windows 系统代理
            
            ---
            
            ### 📦 下载与使用
            
            1. 下载下方的 **Mobility.zip**
            2. 解压到任意目录
            3. 双击运行 `Mobility.exe`
            4. 点击「启动代理」按钮
            
            > 解压后目录结构示例：  
            > Mobility.exe  
            > core/xray.exe  
            > 其他依赖文件...
            
            ---
            
            ### 🛠️ 系统要求
            
            - Windows 10 / 11（64 位）
            - 无需安装 Python 或其他依赖
            
            ---
            
            <div align="center">
            
            **Enjoy the freedom of the network.**
            
            </div>
          files: dist/Mobility.zip
          generate_release_notes: false
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
