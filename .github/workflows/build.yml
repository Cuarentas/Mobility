name: Build Portable EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

      - name: Build with Nuitka (onefile)
        run: |
          python -m nuitka ^
            --standalone ^
            --onefile ^
            --windows-console-mode=disable ^
            --enable-plugin=tk-inter ^
            --assume-yes-for-downloads ^
            --output-filename=Mobility.exe ^
            --output-dir=dist ^
            main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mobility
          path: dist/Mobility.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Mobility ${{ github.ref_name }}"
          body: |
            <div align="center">
            
            # Mobility
            
            **Windows 便携版代理客户端**
            
            </div>
            
            ---
            
            ### ✨ 本版本亮点
            
            - 🚀 单文件便携，下载即用，无需安装任何运行环境
            - 📥 首次启动自动下载最新 Xray-core
            - 🔌 一键启动 / 停止本地代理
            - 🌐 自动设置与取消 Windows 系统代理
            
            ---
            
            ### 📦 下载与使用
            
            1. 下载下方的 **Mobility.exe**
            2. 双击运行
            3. 点击「启动代理」按钮
            
            > 提示：程序运行后会在同目录生成 `core` 文件夹存放核心文件。
            
            ---
            
            ### 🛠️ 系统要求
            
            - Windows 10 / 11（64 位）
            - 无需安装 Python 或其他依赖
            
            ---
            
            <div align="center">
            
            **Enjoy the freedom of the network.**
            
            </div>
          files: dist/Mobility.exe
          generate_release_notes: false
          draft: false
          prerelease: false
