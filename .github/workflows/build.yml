name: Build Portable

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（例如 v0.1.0）'
        required: true
        default: 'v0.1.0'
        type: string
      prerelease:
        description: '是否标记为预发布（Pre-release）'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          python -m PyInstaller --version

      - name: Download Xray-core and geo data
        shell: pwsh
        run: |
          Write-Host "开始下载 Xray-core（curl 直链）..."
          # windows-latest 自带 curl.exe，能正确跟随 GitHub 跳转
          $xrayUrl = "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip"
          & curl.exe -L --fail --retry 3 --retry-delay 2 -A "Mozilla/5.0" -o "xray.zip" $xrayUrl
          if (-not (Test-Path "xray.zip")) { throw "xray.zip download failed" }

          if (Test-Path "core") { Remove-Item -Recurse -Force "core" }
          New-Item -ItemType Directory -Path "core" -Force | Out-Null
          Expand-Archive -Path "xray.zip" -DestinationPath "core" -Force
          if (-not (Test-Path "core\xray.exe")) { throw "xray.exe not found after extract" }
          Write-Host "Xray-core 准备就绪"

          Write-Host "下载 geoip.dat / geosite.dat..."
          & curl.exe -L --fail --retry 3 -A "Mozilla/5.0" -o "core\geoip.dat" "https://github.com/v2fly/geoip/releases/latest/download/geoip.dat"
          & curl.exe -L --fail --retry 3 -A "Mozilla/5.0" -o "core\geosite.dat" "https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat"
          if (-not (Test-Path "core\geoip.dat")) { throw "geoip.dat download failed" }
          if (-not (Test-Path "core\geosite.dat")) { throw "geosite.dat download failed" }
          Write-Host "geo 数据文件准备就绪"

          Write-Host "下载并内置 wintun.dll（TUN 模式）..."
          & curl.exe -L --fail --retry 3 -A "Mozilla/5.0" -o "wintun.zip" "https://www.wintun.net/builds/wintun-0.14.1.zip"
          if (-not (Test-Path "wintun.zip")) { throw "wintun.zip download failed" }
          if (Test-Path "wintun_extract") { Remove-Item -Recurse -Force "wintun_extract" }
          Expand-Archive -Path "wintun.zip" -DestinationPath "wintun_extract" -Force
          $dll = Get-ChildItem -Path "wintun_extract" -Recurse -Filter "wintun.dll" | Where-Object { $_.FullName -match "amd64" } | Select-Object -First 1
          if (-not $dll) { $dll = Get-ChildItem -Path "wintun_extract" -Recurse -Filter "wintun.dll" | Select-Object -First 1 }
          if (-not $dll) { throw "wintun.dll not found in zip" }
          Copy-Item $dll.FullName "core\wintun.dll" -Force
          Write-Host "wintun.dll 已内置到 core/"

          Write-Host "下载并内置 sing-box（TUN）..."
          # 官方资源名含版本号，如 sing-box-1.14.4-windows-amd64.zip，需用 API 解析
          $api = "https://api.github.com/repos/SagerNet/sing-box/releases/latest"
          $rel = Invoke-RestMethod -Uri $api -Headers @{ "User-Agent" = "Mobility-Build" }
          $asset = $rel.assets | Where-Object { $_.name -match "windows-amd64\.zip$" -and $_.name -notmatch "cgo" } | Select-Object -First 1
          if (-not $asset) { $asset = $rel.assets | Where-Object { $_.name -match "windows-amd64" } | Select-Object -First 1 }
          if (-not $asset) { throw "sing-box windows-amd64 asset not found in latest release" }
          Write-Host "sing-box asset: $($asset.name)"
          & curl.exe -L --fail --retry 3 -A "Mozilla/5.0" -o "singbox.zip" $asset.browser_download_url
          if (-not (Test-Path "singbox.zip")) { throw "singbox.zip download failed" }
          if (Test-Path "singbox_extract") { Remove-Item -Recurse -Force "singbox_extract" }
          Expand-Archive -Path "singbox.zip" -DestinationPath "singbox_extract" -Force
          $sb = Get-ChildItem -Path "singbox_extract" -Recurse -Filter "sing-box.exe" | Select-Object -First 1
          if (-not $sb) { throw "sing-box.exe not found after extract" }
          Copy-Item $sb.FullName "core\sing-box.exe" -Force
          
          Write-Host "下载并内置 Mihomo ..."
          $mapi = "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"
          $mrel = Invoke-RestMethod -Uri $mapi -Headers @{ "User-Agent" = "Mobility-Build" }
          $masset = $mrel.assets | Where-Object { $_.name -match '^mihomo-windows-amd64-v[\d.]+\.zip$' } | Select-Object -First 1
          if (-not $masset) { $masset = $mrel.assets | Where-Object { $_.name -match 'windows-amd64' -and $_.name -like '*.zip' -and $_.name -notmatch 'compatible' } | Select-Object -First 1 }
          if (-not $masset) { throw "mihomo windows-amd64 asset not found" }
          Write-Host "mihomo asset: $($masset.name)"
          & curl.exe -L --fail --retry 3 -A "Mozilla/5.0" -o "mihomo.zip" $masset.browser_download_url
          if (-not (Test-Path "mihomo.zip")) { throw "mihomo.zip download failed" }
          if (Test-Path "mihomo_extract") { Remove-Item -Recurse -Force "mihomo_extract" }
          Expand-Archive -Path "mihomo.zip" -DestinationPath "mihomo_extract" -Force
          $mh = Get-ChildItem -Path "mihomo_extract" -Recurse -Filter "*.exe" | Where-Object { $_.Name -match 'mihomo' } | Select-Object -First 1
          if (-not $mh) { $mh = Get-ChildItem -Path "mihomo_extract" -Recurse -Filter "*.exe" | Select-Object -First 1 }
          if (-not $mh) { throw "mihomo.exe not found after extract" }
          Copy-Item $mh.FullName "core\mihomo.exe" -Force
          Write-Host "mihomo.exe 已内置到 core/ ($($mh.Length) bytes)"

          Write-Host "sing-box.exe 已内置到 core/ ($($sb.Length) bytes)"
          Get-ChildItem core | ForEach-Object { Write-Host $_.Name $_.Length }

      - name: Build with PyInstaller (onedir)
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed --name Mobility --icon icons\mobility.ico --hidden-import=pystray --collect-all pystray --hidden-import=keyboard --collect-all keyboard --hidden-import=pyzbar --collect-all pyzbar --hidden-import=cv2 --hidden-import=qrcode --collect-all qrcode --add-data "icons;icons" main.py

      - name: Package final zip (含 Xray-core 与 geo 数据)
        shell: pwsh
        run: |
          $distDir = "dist\Mobility"
          $coreDir = Join-Path $distDir "core"
          if (-not (Test-Path $coreDir)) {
            New-Item -ItemType Directory -Path $coreDir -Force | Out-Null
          }

          # 复制核心与 geo 数据
          Copy-Item -Path "core\xray.exe" -Destination "$coreDir\xray.exe" -Force
          # 图标资源
          if (Test-Path "icons") {
            Copy-Item -Path "icons" -Destination "$distDir\icons" -Recurse -Force
            Write-Host "已复制 icons"
          }
          Copy-Item -Path "core\geoip.dat" -Destination "$coreDir\geoip.dat" -Force
          Copy-Item -Path "core\geosite.dat" -Destination "$coreDir\geosite.dat" -Force
          if (Test-Path "core\wintun.dll") {
            Copy-Item -Path "core\wintun.dll" -Destination "$coreDir\wintun.dll" -Force
          } else {
            throw "缺少文件: wintun.dll"
          }
          if (Test-Path "core\sing-box.exe") {
            Copy-Item -Path "core\sing-box.exe" -Destination "$coreDir\sing-box.exe" -Force
          } else {
            throw "缺少文件: sing-box.exe"
          }
          if (Test-Path "core\mihomo.exe") {
            Copy-Item -Path "core\mihomo.exe" -Destination "$coreDir\mihomo.exe" -Force
          } else {
            throw "缺少文件: mihomo.exe"
          }

          foreach ($f in @("xray.exe", "geoip.dat", "geosite.dat", "wintun.dll", "sing-box.exe", "mihomo.exe")) {
            if (-not (Test-Path "$coreDir\$f")) { throw "缺少文件: $f" }
          }
          Write-Host "已复制 xray.exe / geoip.dat / geosite.dat / wintun.dll / sing-box.exe / mihomo.exe"

          $zipPath = "dist\Mobility.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "$distDir\*" -DestinationPath $zipPath -Force
          $zipInfo = Get-Item $zipPath
          Write-Host "打包完成: $($zipInfo.Name)  大小: $([math]::Round($zipInfo.Length / 1MB, 2)) MB"

      - name: Update README to match current package
        shell: pwsh
        run: |
          $readme = @"
          # Mobility

          **Windows 便携版多核心代理客户端**

          面向日常科学上网与分流场景，内置多套代理核心与路由数据，解压即可使用，无需额外安装运行时。

          ---

          ## 特性概览

          | 模块 | 说明 |
          | --- | --- |
          | 多核心 | **Xray** / **sing-box** / **Mihomo**，按协议映射自动选用 |
          | 协议 | VMess / VLESS / Trojan / Shadowsocks 等 |
          | TUN | 系统级流量接管（需管理员权限，内置 ``wintun.dll``） |
          | 路由 | 规则 / 全局 / 直连；自定义直连与代理域名 |
          | 订阅 | 多订阅管理、定时更新、测速筛选、连通性检测 |
          | 系统集成 | Windows 系统代理、托盘、热键、开机自启 |
          | 分发形态 | PyInstaller 绿色包，``core/`` 内嵌核心与 geo 数据 |

          ### 内置组件（构建时自动拉取最新）

          - ``core/xray.exe`` — Xray-core
          - ``core/sing-box.exe`` — sing-box（TUN / 完整出站）
          - ``core/mihomo.exe`` — Mihomo（Clash Meta 兼容）
          - ``core/geoip.dat`` / ``core/geosite.dat`` — 路由地理与域名数据
          - ``core/wintun.dll`` — Windows TUN 驱动

          ---

          ## 快速开始

          1. 打开 [Releases](../../releases) 下载 ``Mobility.zip``
          2. 解压到任意目录（**保持 ``core`` 文件夹与主程序同级**）
          3. 运行 ``Mobility.exe``
          4. 添加订阅或粘贴节点 → 测速 / 选节点 → 启动

          > TUN 模式请以**管理员身份**运行。若杀软拦截，请将目录加入白名单。

          ---

          ## 核心与协议映射

          在右侧 **设置 → 核心类型（按协议）** 中，可为 VMess / VLESS / Trojan / SS 等分别指定使用 Xray、sing-box 或 Mihomo。  
          启动时根据**当前节点协议**自动选择对应核心，并在标题栏显示该核心版本号。

          ---

          ## 目录结构（解压后）

          ```
          Mobility/
          ├── Mobility.exe
          ├── core/
          │   ├── xray.exe
          │   ├── sing-box.exe
          │   ├── mihomo.exe
          │   ├── geoip.dat
          │   ├── geosite.dat
          │   └── wintun.dll
          └── （运行后生成配置与日志）
          ```

          ---

          ## 反馈与贡献

          - Bug / 功能建议：[Issues 模板](../../issues/new/choose)
          - 参与开发：请先阅读 [CONTRIBUTING.md](CONTRIBUTING.md)

          ## 构建

          使用 **GitHub Actions + PyInstaller** 在 Windows runner 上打包，并自动下载上述核心与数据文件写入发布包。

          Actions → **Build Portable** → **Run workflow**，填写版本号即可构建并创建 Release。

          ---

          ## 免责声明

          本项目仅供学习与研究网络技术使用，请遵守当地法律法规与服务条款。
          "@
          $readme = ($readme -split "`n" | ForEach-Object { $_.TrimStart() }) -join "`n"
          $readme = $readme.Trim() + "`n"

          $current = ""
          if (Test-Path "README.md") {
            $current = Get-Content "README.md" -Raw
          }

          if ($current -ne $readme) {
            Set-Content -Path "README.md" -Value $readme -Encoding utf8
            Write-Host "README.md 已更新"
            echo "readme_changed=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "README.md 无需修改"
            echo "readme_changed=false" >> $env:GITHUB_OUTPUT
          }
        id: readme

      - name: Commit updated README
        if: steps.readme.outputs.readme_changed == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: 同步 README 与当前发布包"
          git push
        continue-on-error: true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mobility
          path: dist/Mobility.zip
          if-no-files-found: error

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}"
          } else {
            $ver = "${{ github.ref_name }}"
          }
          if (-not $ver.StartsWith("v")) {
            $ver = "v$ver"
          }
          echo "tag=$ver" >> $env:GITHUB_OUTPUT
          echo "使用版本号: $ver"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Mobility ${{ steps.version.outputs.tag }}"
          body: |
            ## Mobility ${{ steps.version.outputs.tag }}

            **Windows 便携版多核心代理客户端**

            ### 本版本亮点

            - 解压即用，无需安装 Python / 运行库
            - **多核心内置**：Xray-core + sing-box + Mihomo + geoip/geosite + wintun.dll
            - 按协议映射核心（VMess / VLESS / Trojan / SS → Xray / sing-box / Mihomo）
            - 订阅管理、并行测速、连通性检测、规则/全局/直连
            - TUN 模式（管理员运行）+ Windows 系统代理
            - 托盘 / 热键 / 开机自启 / 主题与字体

            ### 下载与使用

            1. 下载下方 **Mobility.zip**
            2. 解压到任意目录（保持 `core` 文件夹完整）
            3. 运行 `Mobility.exe`
            4. 添加订阅或节点后启动代理

            > TUN 请使用管理员权限。目录请加入杀软白名单以免误删核心文件。

            ### 技术说明

            | 组件 | 用途 |
            | --- | --- |
            | Xray-core | 默认协议出站（VMess/VLESS/Trojan 等） |
            | sing-box | TUN 流量接管 / 可选完整出站 |
            | Mihomo | Clash Meta 兼容出站与规则 |
            | geoip / geosite | 域名与 IP 分流数据 |
            | wintun.dll | Windows TUN 虚拟网卡 |

            构建流水线在打包阶段从各官方 Release 拉取最新核心与数据文件并写入 `core/`。

            ### 系统要求

            - Windows 10 / 11（64 位）

            ---

            *Enjoy the freedom of the network.*

          generate_release_notes: false
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
