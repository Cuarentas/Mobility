name: Build Portable EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（例如 v0.1.0）'
        required: true
        default: 'v0.1.0'
        type: string
      prerelease:
        description: '是否标记为预发布（Pre-release）'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          python -m PyInstaller --version

      - name: Download Xray-core
        shell: pwsh
        run: |
          Write-Host "开始下载 Xray-core..."
          $api = "https://api.github.com/repos/XTLS/Xray-core/releases/latest"
          $release = Invoke-RestMethod -Uri $api -Headers @{ "User-Agent" = "GitHub-Actions" }
          $asset = $release.assets | Where-Object { $_.name -like "*windows-64.zip" -and $_.name -notlike "*arm64*" } | Select-Object -First 1
          if (-not $asset) {
            throw "Xray windows-64.zip not found"
          }
          Write-Host "找到文件: $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "xray.zip"
          if (Test-Path "core") { Remove-Item -Recurse -Force "core" }
          Expand-Archive -Path "xray.zip" -DestinationPath "core" -Force
          if (-not (Test-Path "core\xray.exe")) {
            throw "xray.exe not found after extract"
          }
          Write-Host "Xray-core 准备就绪"

      - name: Build with PyInstaller (onedir)
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed --name Mobility main.py

      - name: Package final zip (含 Xray-core)
        shell: pwsh
        run: |
          $distDir = "dist\Mobility"
          $coreDir = Join-Path $distDir "core"
          if (-not (Test-Path $coreDir)) {
            New-Item -ItemType Directory -Path $coreDir -Force | Out-Null
          }
          Copy-Item -Path "core\xray.exe" -Destination "$coreDir\xray.exe" -Force
          if (-not (Test-Path "$coreDir\xray.exe")) {
            throw "复制 xray.exe 失败"
          }
          Write-Host "已复制 xray.exe"

          $zipPath = "dist\Mobility.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "$distDir\*" -DestinationPath $zipPath -Force
          $zipInfo = Get-Item $zipPath
          Write-Host "打包完成: $($zipInfo.Name)  大小: $([math]::Round($zipInfo.Length / 1MB, 2)) MB"

      - name: Update README to match current package
        shell: pwsh
        run: |
          $readme = @"
          # Mobility

          Windows 代理客户端

          ## 功能

          - 已内置 Xray-core，首次运行无需联网下载
          - 一键启动 / 停止本地代理
          - 自动设置 / 取消 Windows 系统代理
          - 绿色便携版，解压即用

          ## 使用方法

          1. 在 [Releases](../../releases) 下载 ``Mobility.zip``
          2. 解压到任意目录
          3. 双击运行 ``Mobility.exe``
          4. 点击「启动代理」

          > 解压后目录中会包含 ``core/xray.exe`` 等文件，请保持目录完整，不要单独移动 exe。

          ## 反馈与贡献

          - **提交 Bug 或功能建议**：请到 [Issues](../../issues/new/choose) 页面选择对应模板提交
          - **参与开发**：欢迎提交 Pull Request，请先阅读 [贡献指南](CONTRIBUTING.md)

          ## 构建

          使用 GitHub Actions + PyInstaller 自动打包。

          Actions 页面点击 **Build Portable EXE** → **Run workflow**，填写版本号后即可自动构建并发布。
          "@
          # 去掉 here-string 每行开头的缩进
          $readme = ($readme -split "`n" | ForEach-Object { $_.TrimStart() }) -join "`n"
          $readme = $readme.Trim() + "`n"

          $current = ""
          if (Test-Path "README.md") {
            $current = Get-Content "README.md" -Raw
          }

          if ($current -ne $readme) {
            Set-Content -Path "README.md" -Value $readme -Encoding utf8
            Write-Host "README.md 已更新为与当前 zip 包一致"
            echo "readme_changed=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "README.md 内容已是最新，无需修改"
            echo "readme_changed=false" >> $env:GITHUB_OUTPUT
          }
        id: readme

      - name: Commit updated README
        if: steps.readme.outputs.readme_changed == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: 同步 README 与当前发布包 (zip)"
          git push
        continue-on-error: true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mobility
          path: dist/Mobility.zip
          if-no-files-found: error

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}"
          } else {
            $ver = "${{ github.ref_name }}"
          }
          if (-not $ver.StartsWith("v")) {
            $ver = "v$ver"
          }
          echo "tag=$ver" >> $env:GITHUB_OUTPUT
          echo "使用版本号: $ver"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Mobility ${{ steps.version.outputs.tag }}"
          body: |
            <div align="center">
            
            # Mobility
            
            **Windows 便携版代理客户端**
            
            </div>
            
            ---
            
            ### ✨ 本版本亮点
            
            - 📦 解压即用，无需安装任何运行环境
            - 📦 **已内置 Xray-core**，首次运行无需联网下载核心
            - 🔌 一键启动 / 停止本地代理
            - 🌐 自动设置与取消 Windows 系统代理
            
            ---
            
            ### 📦 下载与使用
            
            1. 下载下方的 **Mobility.zip**
            2. 解压到任意目录
            3. 双击运行 `Mobility.exe`
            4. 点击「启动代理」按钮
            
            > 解压后目录结构示例：  
            > Mobility.exe  
            > core/xray.exe  
            > 其他依赖文件...
            
            ---
            
            ### 🛠️ 系统要求
            
            - Windows 10 / 11（64 位）
            - 无需安装 Python 或其他依赖
            
            ---
            
            <div align="center">
            
            **Enjoy the freedom of the network.**
            
            </div>
          files: dist/Mobility.zip
          generate_release_notes: false
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
