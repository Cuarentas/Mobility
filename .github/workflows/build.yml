name: Build Portable EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（例如 v0.1.0）'
        required: true
        default: 'v0.1.0'
        type: string
      prerelease:
        description: '是否标记为预发布（Pre-release）'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

      - name: Download Xray-core
        shell: pwsh
        run: |
          $api = "https://api.github.com/repos/XTLS/Xray-core/releases/latest"
          $release = Invoke-RestMethod -Uri $api -Headers @{ "User-Agent" = "GitHub-Actions" }
          $asset = $release.assets | Where-Object { $_.name -like "*windows-64.zip" -and $_.name -notlike "*arm64*" } | Select-Object -First 1
          if (-not $asset) { throw "Xray windows-64.zip not found" }
          Write-Host "Downloading $($asset.name) ..."
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "xray.zip"
          Expand-Archive -Path "xray.zip" -DestinationPath "core" -Force
          if (-not (Test-Path "core\xray.exe")) { throw "xray.exe not found after extract" }
          Write-Host "Xray-core ready"

      - name: Build with Nuitka (onefile + 内置核心)
        shell: cmd
        run: |
          python -m nuitka --standalone --onefile --windows-console-mode=disable --enable-plugin=tk-inter --assume-yes-for-downloads --include-data-dir=core=core --output-filename=Mobility.exe --output-dir=dist main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mobility
          path: dist/Mobility.exe

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}"
          } else {
            $ver = "${{ github.ref_name }}"
          }
          if (-not $ver.StartsWith("v")) {
            $ver = "v$ver"
          }
          echo "tag=$ver" >> $env:GITHUB_OUTPUT
          echo "使用版本号: $ver"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Mobility ${{ steps.version.outputs.tag }}"
          body: |
            <div align="center">
            
            # Mobility
            
            **Windows 便携版代理客户端**
            
            </div>
            
            ---
            
            ### ✨ 本版本亮点
            
            - 🚀 单文件便携，下载即用，无需安装任何运行环境
            - 📦 **已内置 Xray-core**，首次运行无需联网下载核心
            - 🔌 一键启动 / 停止本地代理
            - 🌐 自动设置与取消 Windows 系统代理
            
            ---
            
            ### 📦 下载与使用
            
            1. 下载下方的 **Mobility.exe**
            2. 双击运行
            3. 点击「启动代理」按钮
            
            > 提示：程序运行后会在同目录生成 `core` 文件夹。
            
            ---
            
            ### 🛠️ 系统要求
            
            - Windows 10 / 11（64 位）
            - 无需安装 Python 或其他依赖
            
            ---
            
            <div align="center">
            
            **Enjoy the freedom of the network.**
            
            </div>
          files: dist/Mobility.exe
          generate_release_notes: false
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
